[package]
name = "bonsai-pot"
version = "0.300.0"
authors = ["Rui He <ruihe774@outlook.com>"]
edition = "2024"
rust-version = "1.87"
description = "A from-scratch, dependency-light, dequant-free Bonsai (Qwen3-architecture) Q1_0 inference engine running on wgpu compute shaders"
readme = "README.md"
repository = "https://github.com/ruihe774/bonsai-pot"
license = "CC0-1.0"
keywords = [
    "llm-inference",
    "llm",
    "vulkan",
    "webgpu",
    "wgpu",
]
categories = ["artificial-intelligence"]

[lib]
name = "bonsai_pot"
path = "src/lib.rs"

[[bin]]
name = "bonsai-pot"
path = "src/bin/bonsai-pot.rs"
required-features = ["bench-internals"]

[features]
default = []
# Exposes bench/microbench utilities under `bonsai_pot::__bench` and pulls in
# the extra deps needed by the bundled `bonsai-pot` binary. Not part of the
# stable public library API.
bench-internals = ["dep:env_logger"]

[dependencies]
# Library deps.
wgpu = { version = "29", default-features = false, features = ["std", "parking_lot", "vulkan"] }
ash = "0.38"
bytemuck = { version = "1", features = ["derive"] }
half = { version = "2", features = ["bytemuck"] }
log = "0.4"
thiserror = "2"

# Bin-only deps (gated behind `bench-internals`, which the bin requires).
env_logger = { version = "0.11", optional = true }

[dev-dependencies]
env_logger = "0.11"
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"] }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
absolute_paths = "warn"
allow_attributes_without_reason = "warn"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
expect_used = "warn"
float_cmp = "allow"
many_single_char_names = "allow"
panic = "warn"
too_many_arguments = "allow"
too_many_lines = "allow"
unused_trait_names = "warn"
unwrap_used = "warn"
