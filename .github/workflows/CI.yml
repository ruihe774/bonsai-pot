name: CI

on:
  - push
  - pull_request
  - workflow_dispatch

env:
  CARGO_TERM_COLOR: always

jobs:
  test-metal:
    name: Build and test Metal backend in macOS
    runs-on: macos-latest
    defaults:
      run:
        working-directory: bonsai-pot
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install dependencies
      run: brew install glslang spirv-tools spirv-cross uv
    - name: Download model
      run: curl -L "https://huggingface.co/prism-ml/Bonsai-4B-gguf/resolve/main/Bonsai-4B-Q1_0.gguf?download=true" -o Bonsai-4B-Q1_0.gguf
    - name: Extract model
      run: uv run scripts/extract.py Bonsai-4B-Q1_0.gguf
    - name: Run tests
      run: cargo test -p bonsai-pot --all-features
    - name: Run prompt & gen
      run: |
        uv run scripts/bpe.py ./model "Once upon a time" | cargo run -p bonsai-pot --all-features -- ./model --mode prompt --max-new-tokens 64 --temperature 0 --seed 0 | tee prompt.txt
        uv run scripts/bpe.py ./model "Once upon a time" | cargo run -p bonsai-pot --all-features -- ./model --mode gen --max-new-tokens 64 --temperature 0 --seed 0 | tee gen.txt
        diff prompt.txt gen.txt
    - name: Bench HEAD
      run: for i in 1 2 3; do cargo run -p bonsai-pot --all-features -- ./model --mode bench --pp 512 --tg 128; done

  bonsai2-build-and-unit-test:
    # Hosted runners have no GPU and the 27B model is 6 GB, so CI covers the
    # shader build, lints, and CPU-side unit tests. GPU integration tests
    # (`bonsai2-pot/tests/gpu_integration.rs`) run locally against ./model.
    name: bonsai2-pot - Build shaders, clippy, unit tests (Linux)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y glslang-tools spirv-tools
    - name: Clippy
      run: cargo clippy -p bonsai2-pot --all-targets --features ci -- -D warnings
    - name: Unit tests
      run: cargo test -p bonsai2-pot --features ci --lib
    - name: no_std build
      run: cargo build -p bonsai2-pot --no-default-features
