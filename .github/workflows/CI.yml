name: CI

on:
  - push
  - pull_request
  - workflow_dispatch

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-unit-test:
    # Hosted runners have no GPU and the 27B model is 6 GB, so CI covers the
    # shader build, lints, and CPU-side unit tests. GPU integration tests
    # (`tests/gpu_integration.rs`) run locally against ./model.
    name: Build shaders, clippy, unit tests (Linux)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y glslang-tools spirv-tools
    - name: Clippy
      run: cargo clippy --all-targets --features ci -- -D warnings
    - name: Unit tests
      run: cargo test --features ci --lib
    - name: no_std build
      run: cargo build --no-default-features
